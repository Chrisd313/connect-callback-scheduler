AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Amazon Connect callback scheduler

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
    Default: dev
  ConnectInstanceId:
    Type: String
  OutboundContactFlowId:
    Type: String
  DefaultCallbackDelayMinutes:
    Type: Number
    Default: 15
  MaxBookingDaysAhead:
    Type: Number
    Default: 7
    Description: Furthest ahead a customer may book a preferred callback time.
  DispatchMaxAttempts:
    Type: Number
    Default: 3
    MinValue: 1
    Description: >-
      Total StartOutboundVoiceContact attempts per callback, first try included, before the
      record goes FAILED. 1 turns retries off.
  DispatchRetryDelaySeconds:
    Type: Number
    Default: 60
    MinValue: 1
    Description: Delay before each retry of a transient Connect error.
  AlarmNotificationTopicArn:
    Type: String
    Default: ""
    Description: >-
      Optional SNS topic ARN to notify when a callback fails permanently. Leave empty to
      create the alarm with no actions.

  # Callback hours. Leave any of these empty to use the defaults compiled into
  # src/lib/defaultCallbackHours.ts. Values are validated when the function starts;
  # a bad value fails every invocation with a clear error rather than mis-scheduling.
  CallbackHours:
    Type: String
    Default: ""
    Description: >-
      Weekly hours in contact-centre local time, e.g. "mon-fri=08:00-20:00,sat=09:00-13:00".
      Days not listed are closed.
  CallbackClosedDates:
    Type: String
    Default: ""
    Description: >-
      Comma-separated YYYY-MM-DD dates we are closed (bank holidays). Replaces the built-in
      list entirely, so include every year still in scope.
  CallbackTimeZone:
    Type: String
    Default: ""
    Description: IANA time zone the hours are expressed in. Defaults to Europe/London.
  CallbackClosingBufferMinutes:
    Type: String
    Default: ""
    Description: Minutes before close during which no callback is scheduled. Defaults to 15.

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmNotificationTopicArn, ""]]

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 6
    Tracing: Active
    Environment:
      Variables:
        CALLBACKS_TABLE: !Ref CallbacksTable
        CONNECT_INSTANCE_ID: !Ref ConnectInstanceId
        OUTBOUND_CONTACT_FLOW_ID: !Ref OutboundContactFlowId
        SCHEDULE_GROUP_NAME: !Ref CallbackScheduleGroup
        DEFAULT_CALLBACK_DELAY_MINUTES: !Ref DefaultCallbackDelayMinutes
        RECORD_RETENTION_DAYS: "30"

Resources:
  CallbacksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "connect-callbacks-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: callbackId
          AttributeType: S
        - AttributeName: sourceContactId
          AttributeType: S
        - AttributeName: phoneNumber
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: callbackId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: bySourceContactId
          KeySchema:
            - AttributeName: sourceContactId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        # cancelCallback looks up pending callbacks by caller number on every inbound
        # call that reaches the menu. Keying on phoneNumber + status means the query
        # reads only the SCHEDULED rows for that number.
        - IndexName: byPhoneNumberStatus
          KeySchema:
            - AttributeName: phoneNumber
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  CallbackScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub "connect-callbacks-${Environment}"

  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-dispatch
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                # Built from the fixed function name rather than !GetAtt: the dispatch
                # function also needs this role's ARN (to schedule its own retries), and
                # referencing each other directly would be circular.
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:connect-dispatch-callback-${Environment}"

  CreateCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "connect-create-callback-${Environment}"
      Handler: dist/src/handlers/createCallback.handler
      CodeUri: .
      Environment:
        Variables:
          DISPATCH_FUNCTION_ARN: !GetAtt DispatchCallbackFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerInvokeRole.Arn
          MAX_BOOKING_DAYS_AHEAD: !Ref MaxBookingDaysAhead
          CALLBACK_HOURS: !Ref CallbackHours
          CALLBACK_CLOSED_DATES: !Ref CallbackClosedDates
          CALLBACK_TIMEZONE: !Ref CallbackTimeZone
          CALLBACK_CLOSING_BUFFER_MINUTES: !Ref CallbackClosingBufferMinutes
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CallbacksTable
        - Statement:
            - Effect: Allow
              Action: scheduler:CreateSchedule
              Resource: !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${CallbackScheduleGroup}/*"
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerInvokeRole.Arn

  CreateCallbackConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CreateCallbackFunction
      Principal: connect.amazonaws.com
      SourceArn: !Sub "arn:aws:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstanceId}"

  CancelCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "connect-cancel-callback-${Environment}"
      Handler: dist/src/handlers/cancelCallback.handler
      CodeUri: .
      Environment:
        Variables:
          # Not used by cancel, but loadConfig requires them.
          DISPATCH_FUNCTION_ARN: "n/a"
          SCHEDULER_ROLE_ARN: "n/a"
      Policies:
        # Covers the table and its indexes (Query on byPhoneNumberStatus, UpdateItem on the table).
        - DynamoDBCrudPolicy:
            TableName: !Ref CallbacksTable
        - Statement:
            - Effect: Allow
              Action: scheduler:DeleteSchedule
              Resource: !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${CallbackScheduleGroup}/*"

  CancelCallbackConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CancelCallbackFunction
      Principal: connect.amazonaws.com
      SourceArn: !Sub "arn:aws:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstanceId}"

  # Explicit log group so the metric filter below can reference it. On a stack that
  # pre-dates this resource, Lambda will already have auto-created the group with this
  # name and CloudFormation will refuse to create it: delete the auto-created group (or
  # import it) before deploying.
  DispatchCallbackLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/connect-dispatch-callback-${Environment}"

  DispatchCallbackFunction:
    Type: AWS::Serverless::Function
    DependsOn: DispatchCallbackLogGroup
    Properties:
      FunctionName: !Sub "connect-dispatch-callback-${Environment}"
      Handler: dist/src/handlers/dispatchCallback.handler
      CodeUri: .
      Environment:
        Variables:
          # Dispatch schedules its own retries, so it needs the same target details as create.
          # Its own ARN is spelled out because a function can't !GetAtt itself.
          DISPATCH_FUNCTION_ARN: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:connect-dispatch-callback-${Environment}"
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerInvokeRole.Arn
          DISPATCH_MAX_ATTEMPTS: !Ref DispatchMaxAttempts
          DISPATCH_RETRY_DELAY_SECONDS: !Ref DispatchRetryDelaySeconds
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CallbacksTable
        - Statement:
            - Effect: Allow
              Action: connect:StartOutboundVoiceContact
              Resource: !Sub "arn:aws:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstanceId}/contact/*"
            - Effect: Allow
              Action: scheduler:CreateSchedule
              Resource: !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${CallbackScheduleGroup}/*"
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerInvokeRole.Arn

  # A callback that has run out of attempts, or hit a permanent Connect error, is logged
  # by dispatchCallback with this exact message (FINAL_FAILURE_MESSAGE in the handler).
  DispatchFinalFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref DispatchCallbackLogGroup
      FilterPattern: '{ $.level = "error" && $.message = "Callback dispatch failed permanently" }'
      MetricTransformations:
        - MetricNamespace: !Sub "ConnectCallbacks/${Environment}"
          MetricName: DispatchFinalFailures
          MetricValue: "1"
          DefaultValue: 0

  DispatchFinalFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "connect-callbacks-${Environment}-dispatch-final-failures"
      AlarmDescription: >-
        One or more scheduled callbacks could not be placed and will not be retried. Find
        them in the dispatch function's logs with
        filter message = "Callback dispatch failed permanently".
      Namespace: !Sub "ConnectCallbacks/${Environment}"
      MetricName: DispatchFinalFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmNotificationTopicArn], []]

Outputs:
  CreateCallbackFunctionArn:
    Value: !GetAtt CreateCallbackFunction.Arn
  CancelCallbackFunctionArn:
    Value: !GetAtt CancelCallbackFunction.Arn
  CallbacksTableName:
    Value: !Ref CallbacksTable
