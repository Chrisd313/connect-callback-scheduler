AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Amazon Connect callback scheduler

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
    Default: dev
  ConnectInstanceId:
    Type: String
  OutboundContactFlowId:
    Type: String
  DefaultCallbackDelayMinutes:
    Type: Number
    Default: 15
  MaxBookingDaysAhead:
    Type: Number
    Default: 7
    Description: Furthest ahead a customer may book a preferred callback time.

  # Callback hours. Leave any of these empty to use the defaults compiled into
  # src/lib/defaultCallbackHours.ts. Values are validated when the function starts;
  # a bad value fails every invocation with a clear error rather than mis-scheduling.
  CallbackHours:
    Type: String
    Default: ""
    Description: >-
      Weekly hours in contact-centre local time, e.g. "mon-fri=08:00-20:00,sat=09:00-13:00".
      Days not listed are closed.
  CallbackClosedDates:
    Type: String
    Default: ""
    Description: >-
      Comma-separated YYYY-MM-DD dates we are closed (bank holidays). Replaces the built-in
      list entirely, so include every year still in scope.
  CallbackTimeZone:
    Type: String
    Default: ""
    Description: IANA time zone the hours are expressed in. Defaults to Europe/London.
  CallbackClosingBufferMinutes:
    Type: String
    Default: ""
    Description: Minutes before close during which no callback is scheduled. Defaults to 15.

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 6
    Tracing: Active
    Environment:
      Variables:
        CALLBACKS_TABLE: !Ref CallbacksTable
        CONNECT_INSTANCE_ID: !Ref ConnectInstanceId
        OUTBOUND_CONTACT_FLOW_ID: !Ref OutboundContactFlowId
        SCHEDULE_GROUP_NAME: !Ref CallbackScheduleGroup
        DEFAULT_CALLBACK_DELAY_MINUTES: !Ref DefaultCallbackDelayMinutes
        RECORD_RETENTION_DAYS: "30"

Resources:
  CallbacksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "connect-callbacks-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: callbackId
          AttributeType: S
        - AttributeName: sourceContactId
          AttributeType: S
        - AttributeName: phoneNumber
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: callbackId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: bySourceContactId
          KeySchema:
            - AttributeName: sourceContactId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        # cancelCallback looks up pending callbacks by caller number on every inbound
        # call that reaches the menu. Keying on phoneNumber + status means the query
        # reads only the SCHEDULED rows for that number.
        - IndexName: byPhoneNumberStatus
          KeySchema:
            - AttributeName: phoneNumber
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  CallbackScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub "connect-callbacks-${Environment}"

  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-dispatch
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt DispatchCallbackFunction.Arn

  CreateCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "connect-create-callback-${Environment}"
      Handler: dist/src/handlers/createCallback.handler
      CodeUri: .
      Environment:
        Variables:
          DISPATCH_FUNCTION_ARN: !GetAtt DispatchCallbackFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerInvokeRole.Arn
          MAX_BOOKING_DAYS_AHEAD: !Ref MaxBookingDaysAhead
          CALLBACK_HOURS: !Ref CallbackHours
          CALLBACK_CLOSED_DATES: !Ref CallbackClosedDates
          CALLBACK_TIMEZONE: !Ref CallbackTimeZone
          CALLBACK_CLOSING_BUFFER_MINUTES: !Ref CallbackClosingBufferMinutes
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CallbacksTable
        - Statement:
            - Effect: Allow
              Action: scheduler:CreateSchedule
              Resource: !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${CallbackScheduleGroup}/*"
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerInvokeRole.Arn

  CreateCallbackConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CreateCallbackFunction
      Principal: connect.amazonaws.com
      SourceArn: !Sub "arn:aws:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstanceId}"

  CancelCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "connect-cancel-callback-${Environment}"
      Handler: dist/src/handlers/cancelCallback.handler
      CodeUri: .
      Environment:
        Variables:
          # Not used by cancel, but loadConfig requires them.
          DISPATCH_FUNCTION_ARN: "n/a"
          SCHEDULER_ROLE_ARN: "n/a"
      Policies:
        # Covers the table and its indexes (Query on byPhoneNumberStatus, UpdateItem on the table).
        - DynamoDBCrudPolicy:
            TableName: !Ref CallbacksTable
        - Statement:
            - Effect: Allow
              Action: scheduler:DeleteSchedule
              Resource: !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${CallbackScheduleGroup}/*"

  CancelCallbackConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CancelCallbackFunction
      Principal: connect.amazonaws.com
      SourceArn: !Sub "arn:aws:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstanceId}"

  DispatchCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "connect-dispatch-callback-${Environment}"
      Handler: dist/src/handlers/dispatchCallback.handler
      CodeUri: .
      Environment:
        Variables:
          # Not used by dispatch, but loadConfig requires them.
          DISPATCH_FUNCTION_ARN: "n/a"
          SCHEDULER_ROLE_ARN: "n/a"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CallbacksTable
        - Statement:
            - Effect: Allow
              Action: connect:StartOutboundVoiceContact
              Resource: !Sub "arn:aws:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstanceId}/contact/*"

Outputs:
  CreateCallbackFunctionArn:
    Value: !GetAtt CreateCallbackFunction.Arn
  CancelCallbackFunctionArn:
    Value: !GetAtt CancelCallbackFunction.Arn
  CallbacksTableName:
    Value: !Ref CallbacksTable
